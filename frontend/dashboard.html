<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Soporte</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/club.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
    <div class="app-layout" id="appLayout">
            <aside class="sidebar" id="sidebar" aria-label="Menú principal" aria-hidden="true" inert>
                <div class="sidebar-brand">
                    <img src="assets/logo-small.svg" alt="Logo">
                    <span class="sidebar-title" id="sidebarTitle">Soporte técnico</span>
                    <button class="menu-button sidebar-close" id="menuClose" type="button" aria-label="Cerrar menú">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <path d="m6 6 12 12M18 6 6 18" />
                        </svg>
                    </button>
                </div>
                <nav class="nav flex-column sidebar-nav" aria-label="Secciones del sistema">
                    <a class="nav-link active" href="#" data-section="dashboard" aria-label="Dashboard" title="Dashboard">
                        <i class="bi bi-speedometer2" aria-hidden="true"></i><span class="nav-label">Dashboard</span>
                    </a>
                    <a class="nav-link" href="#" data-section="tickets" aria-label="Tickets" title="Tickets">
                        <i class="bi bi-ticket" aria-hidden="true"></i><span class="nav-label">Tickets</span>
                    </a>
                    <a class="nav-link" href="#" data-section="nuevo-ticket" aria-label="Nuevo Ticket" title="Nuevo Ticket">
                        <i class="bi bi-plus-circle" aria-hidden="true"></i><span class="nav-label">Nuevo Ticket</span>
                    </a>
                    <a class="nav-link" href="#" data-section="activos" aria-label="Activos" title="Activos">
                        <i class="bi bi-laptop" aria-hidden="true"></i><span class="nav-label">Activos</span>
                    </a>
                    <a class="nav-link" href="cambiar-password.html" aria-label="Cambiar Clave" title="Cambiar Clave">
                        <i class="bi bi-key" aria-hidden="true"></i><span class="nav-label">Cambiar Clave</span>
                    </a>
                    <hr class="border-secondary">
                    <button class="nav-link" id="logoutBtn" type="button" aria-label="Cerrar Sesión" title="Cerrar Sesión">
                        <i class="bi bi-box-arrow-right" aria-hidden="true"></i><span class="nav-label">Cerrar Sesión</span>
                    </button>
                </nav>
            </aside>

            <div class="menu-backdrop" id="menuBackdrop" hidden aria-hidden="true"></div>

            <main class="app-main" id="appMain">
                <header class="topbar">
                    <div class="topbar-heading">
                        <button class="menu-button" id="menuToggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                                <path d="M4 6h16M4 12h16M4 18h16" />
                            </svg>
                        </button>
                        <h4 class="mb-0" id="sectionTitle">Dashboard</h4>
                    </div>
                    <div class="topbar-user">
                        <span class="user-info" id="userName">👤 Cargando...</span>
                        <span class="badge" id="userRole">usuario</span>
                    </div>
                </header>

                <div id="mainContent" class="main-content"></div>
            </main>
    </div>

    <script charset="UTF-8">
        const API_URL = 'http://127.0.0.1:8000/api';
        let token = localStorage.getItem('access_token');
        let userData = JSON.parse(localStorage.getItem('user_data') || '{}');

        if (!token) {
            window.location.href = 'login.html';
        }

        function getHeaders() {
            return {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json; charset=UTF-8'
            };
        }

        document.getElementById('userName').textContent = `👤 ${userData.username || 'Usuario'}`;
        document.getElementById('userRole').textContent = userData.role_display || userData.role || 'usuario';

        const appLayout = document.getElementById('appLayout');
        const sidebar = document.getElementById('sidebar');
        const appMain = document.getElementById('appMain');
        const menuToggle = document.getElementById('menuToggle');
        const menuClose = document.getElementById('menuClose');
        const menuBackdrop = document.getElementById('menuBackdrop');
        const desktopMenu = window.matchMedia('(min-width: 960px)');
        const sidebarPreferenceKey = 'soporte_sidebar_collapsed';
        let sidebarCollapsed = false;
        let mobileMenuOpen = false;

        try {
            sidebarCollapsed = localStorage.getItem(sidebarPreferenceKey) === 'true';
        } catch (error) {
            // El menú también funciona si el navegador bloquea guardar preferencias.
        }

        function renderMenu() {
            const mobileOpen = !desktopMenu.matches && mobileMenuOpen;
            const expanded = desktopMenu.matches ? !sidebarCollapsed : mobileOpen;
            const label = desktopMenu.matches
                ? (expanded ? 'Contraer menú' : 'Expandir menú')
                : (expanded ? 'Cerrar menú' : 'Abrir menú');

            appLayout.classList.toggle('sidebar-collapsed', desktopMenu.matches && sidebarCollapsed);
            appLayout.classList.toggle('menu-open', mobileOpen);
            document.body.classList.toggle('menu-open', mobileOpen);
            sidebar.inert = !desktopMenu.matches && !mobileOpen;
            sidebar.setAttribute('aria-hidden', String(sidebar.inert));
            appMain.inert = mobileOpen;
            menuBackdrop.hidden = !mobileOpen;
            menuToggle.setAttribute('aria-expanded', String(expanded));
            menuToggle.setAttribute('aria-label', label);
            menuToggle.title = label;

            if (mobileOpen) {
                sidebar.setAttribute('role', 'dialog');
                sidebar.setAttribute('aria-modal', 'true');
                sidebar.setAttribute('aria-labelledby', 'sidebarTitle');
            } else {
                sidebar.removeAttribute('role');
                sidebar.removeAttribute('aria-modal');
                sidebar.removeAttribute('aria-labelledby');
            }
        }

        function closeMobileMenu() {
            if (!mobileMenuOpen) return;
            mobileMenuOpen = false;
            renderMenu();
            menuToggle.focus();
        }

        menuToggle.addEventListener('click', function() {
            if (desktopMenu.matches) {
                sidebarCollapsed = !sidebarCollapsed;
                try {
                    localStorage.setItem(sidebarPreferenceKey, String(sidebarCollapsed));
                } catch (error) {
                    // Se conserva el estado en esta página aunque no pueda guardarse.
                }
                renderMenu();
            } else if (mobileMenuOpen) {
                closeMobileMenu();
            } else {
                mobileMenuOpen = true;
                renderMenu();
                menuClose.focus();
            }
        });

        menuClose.addEventListener('click', closeMobileMenu);
        menuBackdrop.addEventListener('click', closeMobileMenu);
        sidebar.querySelectorAll('a[href]:not([href="#"])').forEach(link => {
            link.addEventListener('click', closeMobileMenu);
        });

        document.addEventListener('keydown', function(event) {
            if (!mobileMenuOpen || desktopMenu.matches) return;
            if (event.key === 'Escape') {
                event.preventDefault();
                closeMobileMenu();
            } else if (event.key === 'Tab') {
                const controls = Array.from(sidebar.querySelectorAll('a[href], button:not([disabled])'))
                    .filter(control => control.getClientRects().length > 0);
                const first = controls[0];
                const last = controls[controls.length - 1];
                const outside = !sidebar.contains(document.activeElement);
                if (event.shiftKey && (document.activeElement === first || outside)) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && (document.activeElement === last || outside)) {
                    event.preventDefault();
                    first.focus();
                }
            }
        });

        desktopMenu.addEventListener('change', function() {
            const focusedInSidebar = sidebar.contains(document.activeElement);
            const focusedOnClose = document.activeElement === menuClose;
            const wasMobileOpen = mobileMenuOpen;
            mobileMenuOpen = false;
            renderMenu();
            if (wasMobileOpen || (focusedInSidebar && (!desktopMenu.matches || focusedOnClose))) menuToggle.focus();
        });

        renderMenu();

        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('¿Cerrar sesión?')) {
                localStorage.clear();
                window.location.href = 'login.html';
            }
        });

        document.querySelectorAll('.sidebar .nav-link[data-section]').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.sidebar .nav-link').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('sectionTitle').textContent = this.textContent.trim();
                loadSection(this.dataset.section);
                closeMobileMenu();
            });
        });

        const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const PRIORIDAD_PILL = { critica: 'pill-rojo', alta: 'pill-ambar', media: 'pill-azul', baja: 'pill-verde' };

        function pageHeading(kicker, title, sub) {
            return `<header class="page-heading">
                <div class="page-kicker"><span aria-hidden="true"></span><p class="page-eyebrow">${kicker}</p></div>
                <h1>${title}</h1>
                <p class="page-sub">${sub}</p>
                <div class="page-axis" aria-hidden="true"><span></span><span></span><span></span></div>
            </header>`;
        }

        function metricCard(label, value, icon, helper, accent, badge = '', alerta = false) {
            return `<article class="metric-card${accent ? ' accent' : ''}${alerta ? ' alerta' : ''}">
                <div class="metric-icon"><i class="bi ${icon}" aria-hidden="true"></i></div>
                <p class="metric-label">${label}</p>
                <div class="metric-row"><strong class="metric-value">${value}</strong>${badge}</div>
                <p class="metric-helper">${helper}</p>
            </article>`;
        }

        // Insignia de variación. inverso = true cuando bajar es bueno (p. ej. el tiempo de resolución).
        function variationBadge(variacion, inverso = false) {
            if (variacion === null || variacion === undefined) {
                return '<span class="metric-change neutro" title="Sin período comparable">Sin base</span>';
            }
            const n = Math.abs(variacion).toLocaleString('es-ES', { maximumFractionDigits: 1 });
            if (variacion === 0) return '<span class="metric-change neutro">— 0%</span>';
            const sube = variacion > 0;
            const bueno = sube !== inverso;
            return `<span class="metric-change ${bueno ? 'positivo' : 'negativo'}" title="${sube ? 'Subió' : 'Bajó'} ${n} % frente al período anterior">${sube ? '▲ +' : '▼ −'}${n}%</span>`;
        }

        const nf = new Intl.NumberFormat('es-ES', { maximumFractionDigits: 1 });
        function formatHoras(h) {
            if (h === null || h === undefined) return '—';
            if (h < 1) return `${Math.round(h * 60)} min`;
            if (h >= 48) return `${nf.format(h / 24)} d`;
            return `${nf.format(h)} h`;
        }

        // ---- Gráficos (ECharts) ----
        const COLORES = { rojo: '#BE1E2D', noche: '#343B4D', gris: '#626975', linea: '#DEDAD5', tinta: '#161D29' };
        let charts = [];
        function disposeCharts() {
            charts.forEach(c => { c.observer.disconnect(); c.chart.dispose(); });
            charts = [];
        }
        function makeChart(id, option) {
            const el = document.getElementById(id);
            if (!el) return;
            if (!window.echarts) {
                el.innerHTML = '<p class="sin-datos">No se pudo cargar la librería de gráficos.</p>';
                return;
            }
            const chart = echarts.init(el, null, { renderer: 'canvas' });
            chart.setOption({
                textStyle: { fontFamily: "'DM Sans', sans-serif" },
                animation: !window.matchMedia('(prefers-reduced-motion: reduce)').matches,
                ...option
            });
            const observer = new ResizeObserver(() => chart.resize());
            observer.observe(el);
            charts.push({ chart, observer });
        }

        function renderCharts(d) {
            const tooltip = { backgroundColor: '#fff', borderColor: COLORES.linea, textStyle: { color: COLORES.tinta, fontSize: 12 } };
            const fechas = d.serie_diaria.map(x => x.fecha.slice(5).split('-').reverse().join('/'));

            makeChart('chartSerie', {
                color: [COLORES.rojo, COLORES.noche],
                tooltip: { ...tooltip, trigger: 'axis' },
                legend: { bottom: 0, itemWidth: 14, itemHeight: 3, textStyle: { color: COLORES.gris } },
                grid: { top: 16, left: 8, right: 16, bottom: 34, containLabel: true },
                xAxis: { type: 'category', data: fechas, boundaryGap: false, axisLine: { lineStyle: { color: COLORES.linea } }, axisLabel: { color: COLORES.gris } },
                yAxis: { type: 'value', minInterval: 1, splitLine: { lineStyle: { color: COLORES.linea, type: 'dashed' } }, axisLabel: { color: COLORES.gris } },
                series: [
                    { name: 'Creados', type: 'line', smooth: true, showSymbol: false, data: d.serie_diaria.map(x => x.creados),
                      areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(190,30,45,.22)' }, { offset: 1, color: 'rgba(190,30,45,0)' }]) } },
                    { name: 'Resueltos', type: 'line', smooth: true, showSymbol: false, data: d.serie_diaria.map(x => x.resueltos) }
                ]
            });

            const colorPrioridad = { critica: '#8F0E26', alta: '#D73246', media: '#343B4D', baja: '#B4B9C2' };
            makeChart('chartPrioridad', {
                tooltip: { ...tooltip, trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                legend: { bottom: 0, icon: 'circle', itemWidth: 8, textStyle: { color: COLORES.gris } },
                series: [{
                    type: 'pie', radius: ['52%', '74%'], center: ['50%', '45%'], avoidLabelOverlap: true,
                    itemStyle: { borderColor: '#fff', borderWidth: 2 }, label: { show: false },
                    data: d.por_prioridad.map(x => ({ name: x.nombre, value: x.total, itemStyle: { color: colorPrioridad[x.clave] || COLORES.gris } }))
                }]
            });

            const cats = d.por_categoria.slice().reverse();
            makeChart('chartCategoria', {
                color: [COLORES.rojo],
                tooltip: { ...tooltip, trigger: 'axis', axisPointer: { type: 'shadow' } },
                grid: { top: 8, left: 8, right: 32, bottom: 4, containLabel: true },
                xAxis: { type: 'value', minInterval: 1, splitLine: { lineStyle: { color: COLORES.linea, type: 'dashed' } }, axisLabel: { color: COLORES.gris } },
                yAxis: { type: 'category', data: cats.map(x => x.nombre), axisLine: { lineStyle: { color: COLORES.linea } }, axisTick: { show: false }, axisLabel: { color: COLORES.tinta } },
                series: [{ type: 'bar', barWidth: 14, data: cats.map(x => x.total), itemStyle: { borderRadius: [0, 6, 6, 0] }, label: { show: true, position: 'right', color: COLORES.gris } }]
            });
        }

        function panel(title, sub, inner) {
            return `<article class="panel">
                <div class="panel-header"><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>
                ${inner}
            </article>`;
        }

        function ticketsTable(tickets, conIA) {
            const cols = conIA ? 6 : 5;
            return `<div class="table-responsive"><table class="club-table">
                <thead><tr><th>ID</th><th>Título</th><th>Categoría</th><th>Prioridad</th><th>Estado</th>${conIA ? '<th>Confianza IA</th>' : ''}</tr></thead>
                <tbody>${tickets.map(t => `<tr>
                    <td>#${t.id}</td>
                    <td>${esc(t.titulo)}</td>
                    <td><span class="pill">${esc(t.categoria_display)}</span></td>
                    <td><span class="pill ${PRIORIDAD_PILL[t.prioridad] || ''}">${esc(t.prioridad_display)}</span></td>
                    <td><span class="pill">${esc(t.estado_display)}</span></td>
                    ${conIA ? `<td>${((t.confianza_clasificacion || 0) * 100).toFixed(0)}%</td>` : ''}
                </tr>`).join('') || `<tr><td colspan="${cols}" class="sin-datos">No hay tickets.</td></tr>`}</tbody>
            </table></div>`;
        }

        function loadSection(section) {
            disposeCharts();
            switch(section) {
                case 'dashboard': loadDashboard(); break;
                case 'tickets': loadTickets(); break;
                case 'nuevo-ticket': loadNuevoTicket(); break;
                case 'activos': loadActivos(); break;
                default: loadDashboard();
            }
        }

        let periodoDias = 30;

        function chartPanel(title, sub, id, extraClass = '') {
            return `<div class="${extraClass}">${panel(title, sub, `<div class="panel-body"><div class="chart-box" id="${id}"></div></div>`)}</div>`;
        }

        async function loadDashboard() {
            const container = document.getElementById('mainContent');
            disposeCharts();
            container.innerHTML = '<div class="main-inner text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2">Cargando...</p></div>';

            try {
                const [mRes, dRes, tRes] = await Promise.all([
                    fetch(`${API_URL}/tickets/metricas/`, { headers: getHeaders() }),
                    fetch(`${API_URL}/tickets/metricas/detalle/?dias=${periodoDias}`, { headers: getHeaders() }),
                    fetch(`${API_URL}/tickets/`, { headers: getHeaders() })
                ]);
                if (!mRes.ok || !dRes.ok) throw new Error('No se pudieron cargar las métricas');
                const metrics = await mRes.json();
                const d = await dRes.json();
                const ticketsData = await tRes.json();
                const tickets = ticketsData.results || ticketsData || [];
                const dias = d.dias;
                const ia = d.ia;

                container.innerHTML = `<div class="main-inner">
                    ${pageHeading('Visión general', 'Resultados del soporte técnico', 'Lectura ejecutiva de los tickets, su resolución y la satisfacción de los usuarios.')}
                    <div class="toolbar">
                        <label for="periodoDias">Período</label>
                        <select id="periodoDias" class="form-select form-select-sm">
                            ${[7, 30, 90].map(n => `<option value="${n}" ${n === dias ? 'selected' : ''}>Últimos ${n} días</option>`).join('')}
                        </select>
                        <span class="toolbar-note">La variación se compara con los ${dias} días anteriores.</span>
                    </div>

                    <section aria-labelledby="kpi-vol">
                        <h2 class="section-title" id="kpi-vol">Volumen y resultados</h2>
                        <div class="metric-grid">
                            ${metricCard('Total tickets', metrics.total_tickets || 0, 'bi-ticket-perforated',
                                `${d.creados.valor} nuevos en los últimos ${dias} días.`, true, variationBadge(d.creados.variacion))}
                            ${metricCard('Abiertos', metrics.tickets_abiertos || 0, 'bi-hourglass-split', 'Tickets pendientes de resolver hoy.')}
                            ${metricCard('Resueltos', metrics.tickets_resueltos || 0, 'bi-check2-circle',
                                `${d.resueltos.valor} en el período` + (d.tasa_resolucion !== null ? ` · tasa de resolución ${nf.format(d.tasa_resolucion)}%.` : '.'),
                                false, variationBadge(d.resueltos.variacion))}
                            ${metricCard('Satisfacción', d.satisfaccion.valor === null ? '—' : nf.format(d.satisfaccion.valor), 'bi-star',
                                'Promedio de calificaciones (1 a 5) del período.', false, variationBadge(d.satisfaccion.variacion))}
                        </div>
                    </section>

                    <section aria-labelledby="kpi-ges">
                        <h2 class="section-title" id="kpi-ges">Indicadores de gestión</h2>
                        <div class="metric-grid">
                            ${metricCard('Tiempo medio de resolución', formatHoras(d.horas_resolucion.valor), 'bi-stopwatch',
                                'Desde que se crea el ticket hasta que se resuelve.', false, variationBadge(d.horas_resolucion.variacion, true))}
                            ${metricCard('Sin asignar', d.sin_asignar, 'bi-person-exclamation',
                                'Tickets abiertos que aún no tienen técnico.', false, '', d.sin_asignar > 0)}
                            ${metricCard('Envejecidos', d.envejecidos, 'bi-hourglass-bottom',
                                `Sin resolver hace más de ${d.umbral_envejecido_dias} días.`, false, '', d.envejecidos > 0)}
                            ${metricCard('Precisión de la IA', ia.confianza_media === null ? '—' : `${nf.format(ia.confianza_media)}%`, 'bi-robot',
                                ia.baja_confianza_pct === null ? 'Sin tickets en el período.'
                                    : `${ia.baja_confianza} tickets (${nf.format(ia.baja_confianza_pct)}%) bajo ${ia.umbral_pct}% de confianza: revisar a mano.`)}
                        </div>
                    </section>

                    <section aria-labelledby="graf-tit">
                        <h2 class="section-title" id="graf-tit">Tendencias</h2>
                        <div class="chart-grid">
                            ${chartPanel('Creados vs. resueltos', `Tickets por día, últimos ${dias} días.`, 'chartSerie', 'span-2')}
                            ${chartPanel('Por prioridad', 'Todos los tickets.', 'chartPrioridad')}
                            ${chartPanel('Por categoría', 'Dónde se concentran los problemas.', 'chartCategoria', 'span-3')}
                        </div>
                    </section>

                    <h2 class="section-title">Últimos tickets</h2>
                    ${panel('Tickets recientes', 'Los 10 más nuevos.', ticketsTable(tickets.slice(0, 10), false))}
                </div>`;

                document.getElementById('periodoDias').addEventListener('change', function () {
                    periodoDias = Number(this.value);
                    loadDashboard();
                });
                renderCharts(d);
            } catch (e) {
                container.innerHTML = `<div class="main-inner"><div class="alert alert-danger">Error: ${esc(e.message)}</div></div>`;
            }
        }

        // ---- Vista "Todos los tickets": búsqueda, orden y paginación en el servidor ----
        const TICKET_SORTS = {
            id: ['id'],
            categoria: ['categoria'],
            prioridad: ['prioridad_orden'], // orden por gravedad (crítica primero), no alfabético
            estado: ['estado'],
            tecnico: ['tecnico_asignado__first_name', 'tecnico_asignado__last_name', 'tecnico_asignado__username'],
            fecha: ['fecha_creacion']
        };
        const TICKET_COLUMNS = [
            { key: 'id', label: 'ID', sort: true },
            { key: 'titulo', label: 'Título' },
            { key: 'categoria', label: 'Categoría', sort: true },
            { key: 'prioridad', label: 'Prioridad', sort: true },
            { key: 'estado', label: 'Estado', sort: true },
            { key: 'tecnico', label: 'Técnico', sort: true },
            { key: 'fecha', label: 'Fecha de creación', sort: true },
            { key: 'ia', label: 'Confianza IA' }
        ];
        const PAGE_SIZES = [25, 50, 100];
        const ticketsState = { page: 1, size: 25, search: '', sort: 'id', dir: 'desc', request: 0 };

        try {
            const guardado = Number(localStorage.getItem('soporte_tickets_page_size'));
            if (PAGE_SIZES.includes(guardado)) ticketsState.size = guardado;
        } catch (error) {
            // Sin almacenamiento: se usa 25.
        }

        const fechaHora = new Intl.DateTimeFormat('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        const entero = new Intl.NumberFormat('es-ES');

        function ticketOrdering() {
            const prefijo = ticketsState.dir === 'desc' ? '-' : '';
            return TICKET_SORTS[ticketsState.sort].map(campo => prefijo + campo).join(',');
        }

        function ticketsTableHtml(data) {
            const tickets = data.results || [];
            const total = data.count || 0;
            const paginas = Math.max(1, Math.ceil(total / ticketsState.size));
            const desde = total ? (ticketsState.page - 1) * ticketsState.size + 1 : 0;
            const hasta = Math.min(total, ticketsState.page * ticketsState.size);

            const cabecera = TICKET_COLUMNS.map(col => {
                if (!col.sort) return `<th scope="col">${col.label}</th>`;
                const activa = ticketsState.sort === col.key;
                const aria = activa ? (ticketsState.dir === 'asc' ? 'ascending' : 'descending') : 'none';
                const icono = activa ? (ticketsState.dir === 'asc' ? 'bi-sort-up' : 'bi-sort-down') : 'bi-arrow-down-up';
                return `<th scope="col" aria-sort="${aria}"><button type="button" class="sort-btn${activa ? ' activa' : ''}" data-sort="${col.key}">${col.label} <i class="bi ${icono}" aria-hidden="true"></i></button></th>`;
            }).join('');

            const filas = tickets.map(t => `<tr>
                <td>#${t.id}</td>
                <td>${esc(t.titulo)}</td>
                <td><span class="pill">${esc(t.categoria_display)}</span></td>
                <td><span class="pill ${PRIORIDAD_PILL[t.prioridad] || ''}">${esc(t.prioridad_display)}</span></td>
                <td><span class="pill">${esc(t.estado_display)}</span></td>
                <td>${t.tecnico_nombre ? esc(t.tecnico_nombre) : '<span class="texto-apagado">Sin asignar</span>'}</td>
                <td class="nowrap">${fechaHora.format(new Date(t.fecha_creacion))}</td>
                <td>${((t.confianza_clasificacion || 0) * 100).toFixed(0)}%</td>
            </tr>`).join('');

            const vacio = ticketsState.search
                ? `Sin resultados para «${esc(ticketsState.search)}».`
                : 'No hay tickets.';

            return `<div class="table-responsive"><table class="club-table club-table-wide">
                    <caption class="visually-hidden">Listado de tickets</caption>
                    <thead><tr>${cabecera}</tr></thead>
                    <tbody>${filas || `<tr><td colspan="${TICKET_COLUMNS.length}" class="sin-datos">${vacio}</td></tr>`}</tbody>
                </table></div>
                <div class="table-footer">
                    <p class="table-count">${total ? `Mostrando ${entero.format(desde)}–${entero.format(hasta)} de ${entero.format(total)} ${total === 1 ? 'ticket' : 'tickets'}` : '0 tickets'} · Página ${entero.format(ticketsState.page)} de ${entero.format(paginas)}</p>
                    <nav class="pager" aria-label="Paginación de tickets">
                        <button type="button" class="btn-club" data-page="${ticketsState.page - 1}" ${ticketsState.page <= 1 ? 'disabled' : ''}><i class="bi bi-chevron-left" aria-hidden="true"></i> Anterior</button>
                        <button type="button" class="btn-club" data-page="${ticketsState.page + 1}" ${ticketsState.page >= paginas ? 'disabled' : ''}>Siguiente <i class="bi bi-chevron-right" aria-hidden="true"></i></button>
                    </nav>
                </div>`;
        }

        async function fetchTickets() {
            const caja = document.getElementById('ticketsTable');
            if (!caja) return;
            const turno = ++ticketsState.request;
            caja.setAttribute('aria-busy', 'true');

            const pedir = page => {
                const params = new URLSearchParams({ page, page_size: ticketsState.size, ordering: ticketOrdering() });
                if (ticketsState.search) params.set('search', ticketsState.search);
                return fetch(`${API_URL}/tickets/?${params}`, { headers: getHeaders() });
            };

            try {
                let res = await pedir(ticketsState.page);
                // Si la página pedida ya no existe (por ejemplo tras borrar tickets), vuelve a la primera
                if (res.status === 404 && ticketsState.page > 1) {
                    ticketsState.page = 1;
                    res = await pedir(1);
                }
                if (!res.ok) throw new Error('No se pudieron cargar los tickets');
                const data = await res.json();
                if (turno !== ticketsState.request) return; // llegó una respuesta más nueva
                caja.innerHTML = ticketsTableHtml(data);
            } catch (e) {
                if (turno !== ticketsState.request) return;
                caja.innerHTML = `<div class="panel-body"><div class="alert alert-danger mb-0">${esc(e.message)}
                    <button type="button" class="btn btn-sm btn-primary ms-2" id="reintentarTickets">Reintentar</button></div></div>`;
                document.getElementById('reintentarTickets').addEventListener('click', fetchTickets);
            } finally {
                if (turno === ticketsState.request) caja.setAttribute('aria-busy', 'false');
            }
        }

        function loadTickets() {
            const container = document.getElementById('mainContent');
            ticketsState.page = 1;
            ticketsState.search = '';

            container.innerHTML = `<div class="main-inner">
                ${pageHeading('Gestión', 'Todos los tickets', 'Busca, ordena y recorre todos los tickets con su técnico asignado y fecha de creación.')}
                <article class="panel">
                    <div class="panel-header with-tools">
                        <div><h2>Tickets</h2><p>Haz clic en el título de una columna para ordenar.</p></div>
                        <div class="table-tools">
                            <form id="ticketsBuscar" role="search" class="search-box" aria-label="Buscar tickets">
                                <i class="bi bi-search" aria-hidden="true"></i>
                                <input type="search" id="ticketsBuscarInput" class="form-control" maxlength="100" autocomplete="off"
                                       placeholder="Buscar por ID, título, técnico…" aria-label="Buscar tickets">
                            </form>
                            <label class="size-select" for="ticketsSize">Mostrar
                                <select id="ticketsSize" class="form-select form-select-sm">
                                    ${PAGE_SIZES.map(n => `<option value="${n}" ${n === ticketsState.size ? 'selected' : ''}>${n}</option>`).join('')}
                                </select>
                            </label>
                        </div>
                    </div>
                    <div id="ticketsTable" class="tickets-table" aria-live="polite" aria-busy="true"></div>
                </article>
            </div>`;

            const buscador = document.getElementById('ticketsBuscarInput');
            let espera;
            const buscar = () => {
                const texto = buscador.value.trim();
                if (texto === ticketsState.search) return;
                ticketsState.search = texto;
                ticketsState.page = 1;
                fetchTickets();
            };
            buscador.addEventListener('input', () => { clearTimeout(espera); espera = setTimeout(buscar, 300); });
            document.getElementById('ticketsBuscar').addEventListener('submit', e => { e.preventDefault(); clearTimeout(espera); buscar(); });

            document.getElementById('ticketsSize').addEventListener('change', function () {
                ticketsState.size = Number(this.value);
                ticketsState.page = 1;
                try { localStorage.setItem('soporte_tickets_page_size', String(ticketsState.size)); } catch (error) { /* sin almacenamiento */ }
                fetchTickets();
            });

            document.getElementById('ticketsTable').addEventListener('click', function (e) {
                const orden = e.target.closest('[data-sort]');
                const pagina = e.target.closest('[data-page]');
                if (orden) {
                    const clave = orden.dataset.sort;
                    if (ticketsState.sort === clave) {
                        ticketsState.dir = ticketsState.dir === 'asc' ? 'desc' : 'asc';
                    } else {
                        ticketsState.sort = clave;
                        ticketsState.dir = 'asc';
                    }
                    ticketsState.page = 1;
                    fetchTickets().then(() => document.querySelector(`#ticketsTable [data-sort="${clave}"]`)?.focus());
                } else if (pagina && !pagina.disabled) {
                    ticketsState.page = Number(pagina.dataset.page);
                    fetchTickets();
                }
            });

            fetchTickets();
        }

        async function loadNuevoTicket() {
            const container = document.getElementById('mainContent');
            container.innerHTML = `<div class="main-inner">
                ${pageHeading('Gestión', 'Crear nuevo ticket', 'Describe el problema y el sistema lo clasificará automáticamente.')}
                ${panel('Datos del ticket', '', `<div class="panel-body"><form id="formTicket">
                    <div class="mb-3">
                        <label class="form-label">Título *</label>
                        <input type="text" class="form-control" id="titulo" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción *</label>
                        <textarea class="form-control" id="descripcion" rows="4" required></textarea>
                    </div>
                    <div class="alert alert-info"><i class="bi bi-robot"></i> El sistema clasificará automáticamente tu ticket con IA.</div>
                    <button type="submit" class="btn btn-primary">Enviar ticket</button>
                </form></div>`)}
            </div>`;

            document.getElementById('formTicket').addEventListener('submit', async function(e) {
                e.preventDefault();
                const titulo = document.getElementById('titulo').value;
                const descripcion = document.getElementById('descripcion').value;

                try {
                    const res = await fetch(`${API_URL}/tickets/`, {
                        method: 'POST',
                        headers: getHeaders(),
                        body: JSON.stringify({ titulo, descripcion })
                    });

                    if (res.ok) {
                        alert('✅ Ticket creado exitosamente');
                        loadTickets();
                    } else {
                        const err = await res.json();
                        alert('❌ Error: ' + JSON.stringify(err));
                    }
                } catch (e) {
                    alert('Error: ' + e.message);
                }
            });
        }

        async function loadActivos() {
            const container = document.getElementById('mainContent');
            try {
                const res = await fetch(`${API_URL}/activos/`, { headers: getHeaders() });
                const data = await res.json();
                const activos = data.results || data || [];

                container.innerHTML = `<div class="main-inner">
                    ${pageHeading('Inventario', 'Activos tecnológicos', 'Equipos registrados y su estado actual.')}
                    ${panel('Activos', `${activos.length} en total`, `<div class="table-responsive"><table class="club-table">
                        <thead><tr><th>Código</th><th>Nombre</th><th>Modelo</th><th>Estado</th></tr></thead>
                        <tbody>${activos.map(a => `<tr>
                            <td>${esc(a.codigo_inventario)}</td><td>${esc(a.nombre)}</td><td>${esc(a.modelo)}</td>
                            <td><span class="pill">${esc(a.estado_display)}</span></td>
                        </tr>`).join('') || '<tr><td colspan="4" class="sin-datos">No hay activos.</td></tr>'}</tbody>
                    </table></div>`)}
                </div>`;
            } catch (e) {
                container.innerHTML = `<div class="alert alert-danger">Error: ${e.message}</div>`;
            }
        }

        loadDashboard();
    </script>
</body>
</html>
