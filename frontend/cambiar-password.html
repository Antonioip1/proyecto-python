<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-password {
            background: white; border-radius: 20px; padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px; width: 100%;
        }
        .logo-sistema { text-align: center; margin-bottom: 20px; }
        .logo-sistema img { width: 80px; height: 80px; }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; padding: 12px; font-weight: 600;
            width: 100%; border-radius: 10px;
        }
        .form-control { border-radius: 10px; padding: 12px 15px; }
    </style>
</head>
<body>
    <div class="card-password">
        <div class="logo-sistema">
            <img src="assets/logo-small.svg" alt="Logo">
            <h3 class="mt-3">Cambio de Contraseña</h3>
            <p class="text-muted">Por seguridad, actualiza tu contraseña</p>
        </div>

        <div class="alert alert-danger" id="errorAlert" style="display:none;"></div>
        <div class="alert alert-success" id="successAlert" style="display:none;"></div>

        <form id="formPassword">
            <div class="mb-3">
                <label class="form-label">🔒 Contraseña Actual</label>
                <input type="password" class="form-control" id="passwordActual" required>
            </div>
            <div class="mb-3">
                <label class="form-label">🆕 Nueva Contraseña</label>
                <input type="password" class="form-control" id="passwordNueva" required minlength="6">
                <small class="text-muted">Mínimo 6 caracteres</small>
            </div>
            <div class="mb-3">
                <label class="form-label">✅ Confirmar Nueva Contraseña</label>
                <input type="password" class="form-control" id="passwordConfirm" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary">💾 Guardar Cambios</button>
            <a href="dashboard.html" class="btn btn-link w-100 mt-2">Cancelar</a>
        </form>
    </div>

    <script charset="UTF-8">
        document.getElementById('formPassword').addEventListener('submit', async function(e) {
            e.preventDefault();
            const token = localStorage.getItem('access_token');
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');

            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';

            const data = {
                password_actual: document.getElementById('passwordActual').value,
                password_nueva: document.getElementById('passwordNueva').value,
                password_confirmacion: document.getElementById('passwordConfirm').value
            };

            try {
                const res = await fetch('http://127.0.0.1:8000/api/usuarios/cambiar_password/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json; charset=UTF-8'
                    },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (res.ok) {
                    successAlert.textContent = '✅ Contraseña actualizada. Redirigiendo...';
                    successAlert.style.display = 'block';
                    setTimeout(() => {
                        localStorage.clear();
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    errorAlert.textContent = '❌ ' + (result.error || 'Error al cambiar contraseña');
                    errorAlert.style.display = 'block';
                }
            } catch (error) {
                errorAlert.textContent = '❌ Error de conexión';
                errorAlert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
